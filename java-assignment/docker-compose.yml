version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fulfilment-postgres
    environment:
      POSTGRES_USER: fulfilment_user
      POSTGRES_PASSWORD: fulfilment_password
      POSTGRES_DB: fulfilment_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilment_user -d fulfilment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  fulfilment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fulfilment-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfilment_db
      SPRING_DATASOURCE_USERNAME: fulfilment_user
      SPRING_DATASOURCE_PASSWORD: fulfilment_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
