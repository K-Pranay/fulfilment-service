# ============================================
# APPLICATION CONFIGURATION
# ============================================

# Sets the application name to "fulfilment-service"
# Used for identification and logging purposes
spring.application.name=fulfilment-service

# Sets the server to listen on port 8080
# The application will be accessible at http://localhost:8080
server.port=8080

# ============================================
# DATABASE CONFIGURATION
# ============================================

# JDBC connection URL for H2 in-memory database
# - jdbc:h2:mem:fulfilmentdb: Creates an in-memory database named "fulfilmentdb"
# - DB_CLOSE_DELAY=-1: Prevents the database from closing immediately after all connections are closed
# - DB_CLOSE_ON_EXIT=FALSE: Prevents the database from being closed when the JVM exits
spring.datasource.url=jdbc:h2:mem:fulfilmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Specifies the JDBC driver class for H2 database
# This tells Spring which database driver to use for connections
spring.datasource.driverClassName=org.h2.Driver

# Default username for H2 database connection
# "sa" stands for System Administrator (default H2 user)
spring.datasource.username=sa

# Default password for H2 database connection
# Empty password is acceptable for local/test databases
spring.datasource.password=

# Tells Hibernate which SQL dialect to use for H2 database
# This ensures that generated SQL statements are compatible with H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================

# Hibernate DDL (Data Definition Language) auto-generation strategy
# - create-drop: Drops existing tables at startup and creates new ones (destroys data on restart)
# - Suitable for development/testing, NOT for production
spring.jpa.hibernate.ddl-auto=create-drop

# Displays the SQL queries generated and executed by Hibernate
# Useful for debugging and understanding what SQL is being generated
# Shows queries in the console/logs
spring.jpa.show-sql=true

# Delays the initialization of the datasource until needed
# Ensures that SQL scripts (data.sql) can be loaded after Hibernate initializes the schema
# Important for proper database setup order
spring.jpa.defer-datasource-initialization=true

# Specifies additional import files for Hibernate DDL generation
# Currently empty, but can be used to reference SQL schema files
# Example: classpath:schema.sql
spring.jpa.properties.hibernate.hbm2ddl.import_files=

# ============================================
# SQL INITIALIZATION CONFIGURATION
# ============================================

# Controls when SQL initialization scripts are executed
# "always": Runs initialization scripts every time the application starts
# Alternative: "never" would skip execution
spring.sql.init.mode=always

# Specifies the location of SQL data initialization files to load
# classpath:data.sql: Loads data.sql from the resources folder (src/main/resources)
# Used to populate the database with initial/test data after schema creation
spring.sql.init.data-locations=classpath:data.sql

# ============================================
# H2 CONSOLE CONFIGURATION
# ============================================

# Enables the H2 console web interface
# Allows you to access the H2 database through a web browser for administration
# Value: true = enabled, false = disabled
spring.h2.console.enabled=true

# Sets the URL path for accessing the H2 console
# Access the console at http://localhost:8080/h2-console
# Can be customized to any path (e.g., /db-admin, /h2)
spring.h2.console.path=/h2-console

# ============================================
# OPENAPI / SWAGGER UI CONFIGURATION
# ============================================

# Sets the URL path for accessing the Swagger UI documentation
# Access the interactive API documentation at http://localhost:8080/swagger-ui.html
# Swagger UI provides a visual interface to test API endpoints
# Requires springdoc-openapi-ui dependency in pom.xml
springdoc.swagger-ui.path=/swagger-ui.html