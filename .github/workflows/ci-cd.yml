# Name of the GitHub Actions workflow - displayed in the Actions tab on GitHub
name: CI/CD Pipeline - ECom Fulfilment

# "on:" defines when this workflow is triggered
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # JOB 1: BUILD AND TEST
  # Compiles Java code, runs unit & integration tests, packages JAR
  # ============================================================================
  build-and-test:
    name: Build & Run Unit/Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-assignment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw Executable
        run: chmod +x mvnw

      # Run all unit and integration tests using Spring Boot test suite
      - name: Run Maven Tests
        run: ./mvnw clean test

      # Package executable jar
      - name: Build Package
        run: ./mvnw clean package -DskipTests

      # Save the compiled executable JAR file for deployment
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fulfilment-service-jar
          path: java-assignment/target/*.jar
